{% extends 'layouts/base.html' %}
{% block content %}
<div class="page-header">
    <div><h1>New Consultation</h1></div>
    <a href="{{ url_for('consultations.index') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<form method="POST" data-loading>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card mb-3">
                <div class="card-header"><h5 class="card-title">Patient & Department</h5></div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Patient <span class="text-danger">*</span></label>
                            {% if patient %}
                            <input type="hidden" name="patient_id" value="{{ patient.id }}">
                            <input type="text" class="form-control" value="{{ patient.full_name }} ({{ patient.patient_number }})" readonly>
                            {% else %}
                            <select name="patient_id" class="form-select" required>
                                <option value="">Select patient...</option>
                                {% for p in patients %}
                                <option value="{{ p.id }}">{{ p.full_name }} ({{ p.patient_number }})</option>
                                {% endfor %}
                            </select>
                            {% endif %}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <select name="department_id" class="form-select">
                                <option value="">Select department...</option>
                                {% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-header"><h5 class="card-title">Clinical Notes</h5></div>
                <div class="card-body">
                    <div class="mb-3"><label class="form-label">Chief Complaint <span class="text-danger">*</span></label><textarea name="chief_complaint" class="form-control" rows="2" required></textarea></div>
                    <div class="mb-3"><label class="form-label">Symptoms</label><textarea name="symptoms" class="form-control" rows="2"></textarea></div>
                    <div class="mb-3"><label class="form-label">Examination Findings</label><textarea name="examination_findings" class="form-control" rows="2"></textarea></div>
                    <div class="mb-3"><label class="form-label">Clinical Notes</label><textarea name="clinical_notes" class="form-control" rows="3"></textarea></div>
                    <div class="mb-3"><label class="form-label">Treatment Plan</label><textarea name="treatment_plan" class="form-control" rows="2"></textarea></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><h5 class="card-title">Diagnosis</h5></div>
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-md-3"><label class="form-label">ICD Code</label><input type="text" name="diagnosis_code" class="form-control" placeholder="e.g. J06.9"></div>
                        <div class="col-md-6"><label class="form-label">Description</label><input type="text" name="diagnosis_description" class="form-control" placeholder="Primary diagnosis"></div>
                        <div class="col-md-3"><label class="form-label">Type</label><select name="diagnosis_type" class="form-select"><option value="primary">Primary</option><option value="secondary">Secondary</option><option value="differential">Differential</option></select></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card mb-3">
                <div class="card-header"><h5 class="card-title">Vital Signs</h5></div>
                <div class="card-body">
                    <div class="mb-2"><label class="form-label">Blood Pressure</label><input type="text" name="blood_pressure" class="form-control" placeholder="e.g. 120/80"></div>
                    <div class="mb-2"><label class="form-label">Pulse Rate (bpm)</label><input type="text" name="pulse_rate" class="form-control" placeholder="e.g. 72"></div>
                    <div class="mb-2"><label class="form-label">Temperature (°C)</label><input type="text" name="temperature" class="form-control" placeholder="e.g. 36.8"></div>
                    <div class="mb-2"><label class="form-label">Weight (kg)</label><input type="number" step="0.1" name="weight" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Height (cm)</label><input type="number" step="0.1" name="height" class="form-control"></div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check2-circle me-1"></i>Save Consultation</button>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}
