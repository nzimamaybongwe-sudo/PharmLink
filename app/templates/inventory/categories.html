{% extends 'layouts/base.html' %}
{% block content %}
<div class="page-header"><div><h1>Medicine Categories</h1></div><a href="{{ url_for('inventory.medicines') }}" class="btn btn-outline-secondary btn-sm">Back</a></div>
<div class="row g-3">
    <div class="col-md-4">
        <div class="card"><div class="card-header"><h5 class="card-title">Add Category</h5></div><div class="card-body">
            <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3"><label class="form-label">Name <span class="text-danger">*</span></label><input type="text" name="name" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
                <button type="submit" class="btn btn-primary w-100">Add</button>
            </form>
        </div></div>
    </div>
    <div class="col-md-8">
        <div class="card"><div class="card-body p-0">
            <table class="table mb-0"><thead><tr><th>Name</th><th>Description</th></tr></thead><tbody>
            {% for c in categories %}<tr><td class="fw-semibold">{{ c.name }}</td><td class="text-xs text-muted">{{ c.description or '—' }}</td></tr>{% endfor %}
            </tbody></table>
        </div></div>
    </div>
</div>
{% endblock %}
