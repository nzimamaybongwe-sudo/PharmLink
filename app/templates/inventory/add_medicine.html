{% extends 'layouts/base.html' %}
{% block content %}
<div class="page-header">
    <div><h1>Add Medicine</h1></div>
    <a href="{{ url_for('inventory.medicines') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card">
    <div class="card-body">
        <form method="POST" data-loading>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Medicine Name <span class="text-danger">*</span></label><input type="text" name="name" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Generic Name</label><input type="text" name="generic_name" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Brand Name</label><input type="text" name="brand_name" class="form-control"></div>
                <div class="col-md-4">
                    <label class="form-label">Category</label>
                    <select name="category_id" class="form-select">
                        <option value="">Select...</option>
                        {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4"><label class="form-label">Strength</label><input type="text" name="strength" class="form-control" placeholder="e.g. 500mg"></div>
                <div class="col-md-4"><label class="form-label">Dosage Form</label><input type="text" name="dosage_form" class="form-control" placeholder="e.g. Tablet, Syrup"></div>
                <div class="col-md-4"><label class="form-label">Unit of Measurement</label><input type="text" name="unit_of_measurement" class="form-control" placeholder="e.g. tablet, ml"></div>
                <div class="col-md-4"><label class="form-label">Barcode</label><input type="text" name="barcode" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Reorder Level</label><input type="number" name="reorder_level" class="form-control" value="10" min="0"></div>
                <div class="col-md-4 d-flex align-items-end"><div class="form-check"><input type="checkbox" name="is_controlled" value="1" class="form-check-input" id="ctrl"><label class="form-check-label" for="ctrl">Controlled Substance</label></div></div>
                <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
                <div class="col-12"><button type="submit" class="btn btn-primary">Save Medicine</button></div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
