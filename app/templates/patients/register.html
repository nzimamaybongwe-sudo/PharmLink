{% extends 'layouts/base.html' %}
{% block content %}
<div class="page-header">
    <div><h1>Register Patient</h1></div>
    <a href="{{ url_for('patients.index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back
    </a>
</div>
<div class="card">
    <div class="card-body">
        <form method="POST" data-loading>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h6 class="fw-bold text-muted text-uppercase mb-3" style="font-size:.7rem;letter-spacing:.08em;">Personal Information</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-4"><label class="form-label">First Name <span class="text-danger">*</span></label><input type="text" name="first_name" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label">Last Name <span class="text-danger">*</span></label><input type="text" name="last_name" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label">Date of Birth</label><input type="date" name="date_of_birth" class="form-control"></div>
                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select"><option value="">Select...</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select>
                </div>
                <div class="col-md-4"><label class="form-label">National ID</label><input type="text" name="national_id" class="form-control"></div>
                <div class="col-md-4">
                    <label class="form-label">Blood Type</label>
                    <select name="blood_type" class="form-select"><option value="">Unknown</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select>
                </div>
            </div>
            <h6 class="fw-bold text-muted text-uppercase mb-3" style="font-size:.7rem;letter-spacing:.08em;">Contact Information</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-6"><label class="form-label">Phone</label><input type="tel" name="phone" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
                <div class="col-12"><label class="form-label">Physical Address</label><textarea name="physical_address" class="form-control" rows="2"></textarea></div>
                <div class="col-md-6"><label class="form-label">Town</label><input type="text" name="town" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Region</label>
                    <select name="region" class="form-select"><option value="">Select...</option><option>Hhohho</option><option>Manzini</option><option>Shiselweni</option><option>Lubombo</option></select>
                </div>
            </div>
            <h6 class="fw-bold text-muted text-uppercase mb-3" style="font-size:.7rem;letter-spacing:.08em;">Emergency Contact</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-4"><label class="form-label">Name</label><input type="text" name="emergency_name" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Phone</label><input type="tel" name="emergency_phone" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Relationship</label><input type="text" name="emergency_relationship" class="form-control" placeholder="e.g. Spouse"></div>
            </div>
            <h6 class="fw-bold text-muted text-uppercase mb-3" style="font-size:.7rem;letter-spacing:.08em;">Medical Information</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-6"><label class="form-label">Known Allergies</label><textarea name="allergies" class="form-control" rows="2" placeholder="List any known drug or substance allergies"></textarea></div>
                <div class="col-md-6"><label class="form-label">Chronic Conditions</label><textarea name="chronic_conditions" class="form-control" rows="2" placeholder="e.g. Hypertension, Diabetes"></textarea></div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-person-check me-1"></i>Register Patient</button>
                <a href="{{ url_for('patients.index') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
