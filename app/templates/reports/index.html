{% extends 'layouts/base.html' %}
{% block content %}
<div class="page-header"><div><h1>Reports</h1></div></div>
<div class="row g-3">
    <div class="col-md-4">
        <div class="card stat-card">
            <div class="stat-icon icon-primary"><i class="bi bi-file-medical-fill"></i></div>
            <h5>Prescription Report</h5>
            <p class="text-muted text-xs">Prescription activity by date range with CSV export.</p>
            <a href="{{ url_for('reports.prescription_report') }}" class="btn btn-primary btn-sm mt-2">View Report</a>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card">
            <div class="stat-icon icon-success"><i class="bi bi-box-seam-fill"></i></div>
            <h5>Inventory Report</h5>
            <p class="text-muted text-xs">Stock levels, low stock and expiry summary with CSV export.</p>
            <a href="{{ url_for('reports.inventory_report') }}" class="btn btn-primary btn-sm mt-2">View Report</a>
        </div>
    </div>
</div>
{% endblock %}
