{% extends 'layouts/base.html' %}
{% block content %}
<div class="page-header">
    <div><h1>Add User</h1></div>
    <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back
    </a>
</div>
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <form method="POST" data-loading>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">First Name <span class="text-danger">*</span></label><input type="text" name="first_name" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Last Name <span class="text-danger">*</span></label><input type="text" name="last_name" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Email <span class="text-danger">*</span></label><input type="email" name="email" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Phone</label><input type="tel" name="phone" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label">Role <span class="text-danger">*</span></label>
                            <select name="role_id" class="form-select" required>
                                <option value="">Select role...</option>
                                {% for role in roles %}
                                <option value="{{ role.id }}">{{ role.display_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6"><label class="form-label">Organisation</label>
                            <select name="organisation_id" class="form-select">
                                <option value="">Select organisation...</option>
                                {% for org in organisations %}
                                <option value="{{ org.id }}">{{ org.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6"><label class="form-label">Profession / Title</label><input type="text" name="profession" class="form-control" placeholder="e.g. Medical Officer"></div>
                        <div class="col-md-6">
                            <label class="form-label">Temporary Password</label>
                            <input type="text" name="password" class="form-control" value="PharmLink@123">
                            <div class="form-text">User should change this on first login.</div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Create User</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
